# Render Blueprint — single web service serving both API and frontend.
# https://docs.render.com/infrastructure-as-code
#
# Free-tier deployment. The filesystem is ephemeral: data is lost on restart
# or redeploy. Run ingestion from the Library page after each deploy.

services:
  - type: web
    name: pramana
    runtime: python
    plan: free

    # Build: install Python deps, then build the React frontend into frontend/dist/.
    buildCommand: |
      pip install -r requirements.txt &&
      cd frontend && npm install && npm run build

    # Start: run from backend/ so "python -m pramana.cli" resolves the package.
    startCommand: cd backend && python -m pramana.cli serve

    # Render sets PORT automatically; the CLI reads it from the environment.
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.12"
      - key: NODE_VERSION
        value: "20.18.0"
      - key: GEMINI_API_KEY
        sync: false                  # set manually in Render dashboard
      - key: PRAMANA_GENERATOR
        value: "google:gemini-3.8-flash"
      - key: PRAMANA_VERIFIER
        value: "google:gemini-3.7-flash"

    healthCheckPath: /healthz
